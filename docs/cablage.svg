<text x="830" y="515" class="s">▲ → 34 · ▼ → 35 · OK → 39</text>
<text x="830" y="531" class="s">+ une 10 kΩ entre chaque broche et 3V3</text>
<text x="830" y="547" class="s">(34, 35, 39 n'ont pas de rappel interne)</text>
<text x="830" y="563" class="s">OK long = retour · DÉCALAGE long = silence</text>
