<rect x="760" y="440" width="300" height="60" rx="6" class="box"/><text x="770" y="460" class="t">Gros bouton DÉCALAGE (NO, IP67)</text><text x="770" y="478" class="s">une borne → GPIO 32, l'autre → GND (pull-up interne)</text><text x="770" y="494" class="s">câble déporté jusqu'au bain, prise GX12 2 broches</text>
<line x1="650" y1="470" x2="760" y2="470" class="sig"/>
<rect x="760" y="530" width="300" height="100" rx="6" class="box"/><text x="770" y="550" class="t">Buzzer actif 5 V</text><text x="770" y="568" class="s">GPIO 27 → 1 kΩ → base NPN (2N2222 / S8050)</text><text x="770" y="584" class="s">émetteur → GND · collecteur → (−) buzzer</text><text x="770" y="600" class="s">(+) buzzer → VIN 5 V</text><text x="770" y="616" class="s">option : module MOSFET + sirène / gyrophare 12 V</text>
<line x1="650" y1="560" x2="760" y2="560" class="sig"/>
