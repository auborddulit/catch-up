<rect x="760" y="95" width="300" height="50" rx="6" class="box"/><text x="770" y="115" class="t">Écran OLED 1,3" SH1106 (I2C)</text><text x="770" y="133" class="s">VCC → 3V3 · GND → GND · SDA → 21 · SCL → 22</text>
<rect x="760" y="155" width="300" height="50" rx="6" class="box"/><text x="770" y="175" class="t">Horloge DS3231 (I2C)</text><text x="770" y="193" class="s">VCC → 3V3 · GND → GND · SDA → 21 · SCL → 22</text>
<polyline points="650,130 700,130" class="sig"/><line x1="700" y1="115" x2="700" y2="175" class="sig"/><circle cx="700" cy="130" r="3" fill="#1565c0"/><line x1="700" y1="115" x2="760" y2="115" class="sig"/><line x1="700" y1="175" x2="760" y2="175" class="sig"/><text x="704" y="111" class="s">SDA</text><polyline points="650,160 725,160" class="sig2" style="stroke:#6a1b9a"/><line x1="725" y1="137" x2="725" y2="197" style="stroke:#6a1b9a;stroke-width:2"/><circle cx="725" cy="160" r="3" fill="#6a1b9a"/><line x1="725" y1="137" x2="760" y2="137" style="stroke:#6a1b9a;stroke-width:2"/><line x1="725" y1="197" x2="760" y2="197" style="stroke:#6a1b9a;stroke-width:2"/><text x="729" y="152" class="s">SCL</text>
<rect x="760" y="280" width="300" height="110" rx="6" class="box"/><text x="770" y="300" class="t">Lecteur microSD (SPI)</text><text x="770" y="320" class="s">CS → 5 · SCK → 18 · MISO → 19 · MOSI → 23</text><text x="770" y="338" class="s">VCC → VIN (5 V, module avec régulateur) · GND → GND</text><text x="770" y="356" class="s">(module sans régulateur : VCC → 3V3)</text>
<line x1="650" y1="300" x2="760" y2="300" class="sig"/>
<line x1="650" y1="325" x2="760" y2="325" class="sig"/>
