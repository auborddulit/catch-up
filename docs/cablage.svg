<text x="20" y="28" class="h">compteur-up — plan de câblage (ESP32 DevKit)</text>
<text x="20" y="46" class="s">Rouge : 3,3 V · Noir : GND · Bleu : signaux · Vert : 5 V (VIN). Une résistance de 4,7 kΩ entre DATA et 3,3 V pour chacune des 4 sondes.</text>
